g<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login in / Sign Up form</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

   <style>
        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }


        .navbar {
            background: #172554;
            padding: 15px 0;
        }


        .navbar-brand {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }


        .navbar-brand:hover {
            color: #93c5fd;
        }


        .navbar .nav-link {
            color: white;
            margin: 0 10px;
        }


        .navbar .nav-link:hover {
            color: #93c5fd;
        }


        .btn-login {
            border: 1px solid white;
            color: white;
        }


        .btn-login:hover {
            background: white;
            color: #172554;
        }


        .btn-signup {
            background: #2563eb;
            color: white;
        }


        .btn-signup:hover {
            background: #1d4ed8;
            color: white;
        }


        .modal-header {
            background: #172554;
            color: white;
        }


        .modal-header .btn-close {
            filter: invert(1);
        }


        .form-control:focus {
            border-color: green;
            box-shadow: 0 0 5px #93c5fd;
        }


        .welcome {
            text-align: center;
            margin-top: 120px;
        }


        .welcome h1 {
            color: #172554;
            font-weight: bold;
        }
    </style>








    
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">


            <a class="navbar-brand" href="#">
                <i class="bi bi-code-slash"></i> MyWebsite
            </a>


            <button class="navbar-toggler bg-light" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="collapse navbar-collapse" id="navbarMenu">


                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>


                    
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-login w-100"
                                data-bs-toggle="modal"
                                data-bs-target="#loginModal">
                            <i class="bi bi-box-arrow-in-right"></i>
                            Login
                        </button>
                    </li>


                    
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <button class="btn btn-signup w-100"
                                data-bs-toggle="modal"
                                data-bs-target="#signupModal">
                            <i class="bi bi-person-plus-fill"></i>
                            Sign Up
                        </button>
                    </li>
                </ul>


            </div>
        </div>
    </nav>

    <div class="container welcome">
        <h1>Welcome to My Website!</h1>
        <p class="text-secondary">Learn,explore and code here.</p>

        <button class="btn btn-primary mt-3" 
                data-bs-toggle="modal"
                data-bs-target="#signupModal">Get started  
                <i class="bi bi-person-plus-fill"></i>
        </button>
    </div>

    <div class="modal fade" id="loginModal" tab index="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">  <i class="bi bi-person-circle"></i>

                    <!-- this buttion is for closing login modal -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal">

                    </button>
                </div>
                <!-- login modal getting user email and password -->
                <div class="modal-body p-4">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail"
                            class="form-label">Email-address</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email id">
                        </div>

                        <div class="mb-3">
                            <label for="LoginPassword" class="form-label">Password</label>

                            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password"required>

                        </div>

                        <!-- submit button-->
                         <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i>
                            Login
                         </button>
                    </form>
                </div>

                <!-- SignUp modal form-->
                 <div class="modal-body p-4">
                    <form id="SignUpForm">
                        <div class="mb-3">
                            <label for="SignUpEmail"
                            class="form-label">Email-address</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email id">
                        </div>

                        <div class="mb-3">
                            <label for="SignUpPassword">Password</label>

                            <input type="password" class="form-control" id="SignUpPassword" placeholder="Enter your password" minlength="8" required>

                        </div>
                       
                        <div class="mb-3">
                            <label for="ConfirmPassword">ConfirmPassword</label>

                            <input type="password" class="form-control" id="ConfirmPassword" placeholder="Enter your password again" minlength="8">

                        </div>






                        <!-- submit button-->
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-person-check-fill"></i>
                            Create Account
                        </button>

                    </form>
                   <p class="text-center mt-3 mb-0">
                        Already have this Account
                        <a href="#" id="openLoginFromSignup">Login</a>
                    </p>

                    <!-- javascript code-->



                </div>


                
            </div>
        </div>
        
    </div>   












    </div>
















    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script
</body>
</html>
